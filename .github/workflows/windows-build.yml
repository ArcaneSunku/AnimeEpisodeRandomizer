name: Build Windows Application

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows application
        shell: pwsh
        run: |
          .\scripts\package-windows.ps1 app-image

          if (-not (Test-Path "build/native/AnimeEpisodeRandomizer/AnimeEpisodeRandomizer.exe")) {
              throw "Windows executable was not created."
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/native/AnimeEpisodeRandomizer" `
            -DestinationPath "build/native/AnimeEpisodeRandomizer-Windows-x64.zip" `
            -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AnimeEpisodeRandomizer-Windows-x64
          path: build/native/AnimeEpisodeRandomizer-Windows-x64.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/native/AnimeEpisodeRandomizer-Windows-x64.zip